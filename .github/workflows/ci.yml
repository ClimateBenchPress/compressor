name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  release:
    branch: main
    types: [released]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Spellcheck repo
        uses: crate-ci/typos@v1

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --diff --check"

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build all packages
        run: uv build --all-packages

      - name: List the built dist files
        run: ls -lh dist/

      - name: Upload the package sdist and wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  mypy:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the typing dependencies
        run: |
          uv sync --refresh --no-install-workspace \
            --all-groups

      - name: Install the workspace packages
        run: |
          uv pip install dist/*.whl

      - name: Typecheck the package
        run: uv run mypy -p climatebenchpress.compressor

  publish:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name == 'release' }}
    needs:
      # require all jobs to succeed
      - check
      - spelling
      - fmt
      - build # includes the dist artifact
      - mypy
    steps:
      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: List the built dist files
        run: ls -lh dist/

      - name: Publish the packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
