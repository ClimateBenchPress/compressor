[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climatebenchpress-compressor"
version = "1.0.0"
requires-python = ">=3.12"
authors = [
    { name = "Tim Reichelt", email = "tim.reichelt@physics.ox.ac.uk" },
    { name = "Juniper Tyree", email = "juniper.tyree@helsinki.fi" },
]
description = "ClimateBenchPress compression benchmark"
readme = "README.md"
license = "MPL-2.0"
keywords = ["climate", "compression", "benchmark", "compressors", "weather"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

dependencies = [
    "astropy~=7.2.0",
    "cartopy~=0.24.1",
    "cf-xarray~=0.10",
    "cftime~=1.6.0",
    "dask>=2024.12.0,<2025.4",
    "matplotlib~=3.8",
    "netcdf4==1.7.3",
    "numcodecs>=0.13.0,<0.16",
    "numcodecs-combinators[xarray]~=0.2.13",
    "numcodecs-observers~=0.1.2",
    "numcodecs-replace==0.1.0",
    "numcodecs-safeguards==0.1.0b6",
    "numcodecs-wasm==0.2.2",
    "numcodecs-wasm-bit-round==0.4.0",
    "numcodecs-wasm-ebcc==0.3.1a0",
    "numcodecs-wasm-fixed-offset-scale==0.4.0",
    "numcodecs-wasm-jpeg2000==0.3.0",
    "numcodecs-wasm-pco==0.3.0",
    "numcodecs-wasm-round==0.5.0",
    "numcodecs-wasm-sperr==0.2.0",
    "numcodecs-wasm-stochastic-rounding==0.2.0",
    "numcodecs-wasm-sz3==0.7.0",
    "numcodecs-wasm-tthresh==0.3.0",
    "numcodecs-wasm-zfp==0.6.0",
    "numcodecs-wasm-zfp-classic==0.4.0",
    "numcodecs-wasm-zstd==0.4.0",
    "numcodecs-zero==0.1.2",
    "pandas~=2.2",
    "scipy~=1.14",
    "seaborn~=0.13.2",
    "tabulate~=0.9",
    "typed-classproperties~=1.1.0",
    "xarray>=2024.11.0,<2025.4",
    "zarr~=2.18.0",
]

[dependency-groups]
dev = [
    "ipykernel~=6.29",
    "mypy~=1.14",
    "pandas-stubs~=2.2",
    "pre-commit~=4.0",
    "ruff~=0.9",
    "scipy-stubs~=1.15",
    "types-seaborn~=0.13.2.20250111",
]

[tool.hatch.build.targets.wheel]
packages = ["src/climatebenchpress"]

[tool.setuptools.package-data]
"climatebenchpress.compressor" = ["py.typed"]

[[tool.mypy.overrides]]
module = ["numcodecs.*", "astropy.convolution.*", "cartopy.*"]
follow_untyped_imports = true
